name: BioSignal public isolate experiment

run-name: "Public isolate — ${{ inputs.biosample || 'manual' }}"

on:
  workflow_dispatch:
    inputs:
      biosample:
        description: "NCBI BioSample accession (example: SAMN05215988)"
        required: true
        default: "SAMN05215988"
        type: string

permissions:
  contents: read

concurrency:
  group: biosignal-public-isolate
  cancel-in-progress: true

jobs:
  experiment:
    name: "Isolate analysis — ${{ inputs.biosample }}"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BIOSAMPLE: ${{ inputs.biosample }}
      AMRFINDER_ORGANISM: Escherichia

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate BioSample input
        shell: bash
        run: |
          set -euo pipefail
          BIOSAMPLE="${BIOSAMPLE^^}"
          if [[ ! "$BIOSAMPLE" =~ ^SAMN[0-9]+$ ]]; then
            echo "::error::Invalid BioSample accession: $BIOSAMPLE"
            echo "Expected format: SAMN followed by digits, for example SAMN05215988."
            exit 1
          fi
          echo "Using BioSample: $BIOSAMPLE"

      - name: Install unzip
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y unzip

      - name: Install NCBI Datasets CLI
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://ftp.ncbi.nlm.nih.gov/pub/datasets/command-line/v2/linux-amd64/datasets -o datasets
          chmod +x datasets
          sudo mv datasets /usr/local/bin/datasets
          datasets version

      - name: Set up micromamba
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: biosignal
          create-args: python=3.12
          init-shell: bash
          cache-environment: true

      - name: Install AMRFinderPlus
        shell: bash -el {0}
        run: |
          set -euo pipefail
          micromamba install -y --strict-channel-priority -c conda-forge -c bioconda ncbi-amrfinderplus=4.2.7
          amrfinder --version
          amrfinder -u
          amrfinder --database_version
          amrfinder --list_organisms | grep -Fq "$AMRFINDER_ORGANISM"

      - name: Install Nextflow
        shell: bash -el {0}
        run: |
          set -euo pipefail
          curl -fsSL https://get.nextflow.io | bash
          test -x nextflow
          sudo install -m 0755 nextflow /usr/local/bin/nextflow
          /usr/local/bin/nextflow -version

      - name: Install package and run tests
        shell: bash -el {0}
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pytest>=8.0"
          python -c 'import sys; print(f"BIOSIGNAL_PYTHON={sys.executable}")' >> "$GITHUB_ENV"
          echo "BioSignal task interpreter: $(python -c 'import sys; print(sys.executable)')"
          pytest -q

      - name: AMRFinder nucleotide and combined-mode smoke tests
        shell: bash -el {0}
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/ncbi/amr/master"
          curl -fsSL "$base/test_dna.fa" -o "$RUNNER_TEMP/test_dna.fa"
          curl -fsSL "$base/test_prot.fa" -o "$RUNNER_TEMP/test_prot.fa"
          curl -fsSL "$base/test_prot.gff" -o "$RUNNER_TEMP/test_prot.gff"
          amrfinder --plus \
            -n "$RUNNER_TEMP/test_dna.fa" \
            -O "$AMRFINDER_ORGANISM" \
            --print_node \
            -o "$RUNNER_TEMP/amrfinder-nucleotide-smoke.tsv"
          amrfinder --plus \
            -n "$RUNNER_TEMP/test_dna.fa" \
            -p "$RUNNER_TEMP/test_prot.fa" \
            -g "$RUNNER_TEMP/test_prot.gff" \
            -O "$AMRFINDER_ORGANISM" \
            --print_node \
            -o "$RUNNER_TEMP/amrfinder-combined-smoke.tsv"
          test -s "$RUNNER_TEMP/amrfinder-nucleotide-smoke.tsv"
          test -s "$RUNNER_TEMP/amrfinder-combined-smoke.tsv"
          head -5 "$RUNNER_TEMP/amrfinder-combined-smoke.tsv"

      - name: Compile workflow in stub mode
        shell: bash -el {0}
        run: |
          set -euo pipefail
          nextflow run workflows/public_isolate.nf \
            --biosample "$BIOSAMPLE" \
            --amrfinder_organism "$AMRFINDER_ORGANISM" \
            --python_executable "$BIOSIGNAL_PYTHON" \
            --outdir stub-results \
            -stub-run \
            -ansi-log false

      - name: Resolve and run isolate workflow
        # Disable GitHub's implicit -e for this step; the script captures and checks
        # Nextflow and validator exit codes explicitly below.
        shell: bash {0}
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
        run: |
          set -uo pipefail
          # Capture Nextflow's exit code in an if/else so the runner's
          # inherited errexit cannot abort before output verification.
          if nextflow run workflows/public_isolate.nf \
            --biosample "$BIOSAMPLE" \
            --amrfinder_organism "$AMRFINDER_ORGANISM" \
            --python_executable "$BIOSIGNAL_PYTHON" \
            -with-report nextflow-report.html \
            -with-trace nextflow-trace.txt \
            -ansi-log false; then
            nextflow_rc=0
          else
            nextflow_rc=$?
          fi
          echo "Nextflow launcher exit status: $nextflow_rc"

          # A successful task trace and complete, non-empty outputs are the
          # acceptance criteria. Do not trust the launcher status alone.
          python - <<'PY'
          import csv
          import json
          import os
          import re

          required_processes = {"RESOLVE_ASSEMBLY", "DOWNLOAD_GENOME", "AMRFINDERPLUS"}
          with open("nextflow-trace.txt", newline="", encoding="utf-8") as handle:
              rows = list(csv.DictReader(handle, delimiter="\t"))
          observed = {row.get("name"): row for row in rows}
          missing = required_processes - observed.keys()
          if missing:
              raise SystemExit(f"Trace is missing processes: {sorted(missing)}")
          for name in required_processes:
              row = observed[name]
              if row.get("status") != "COMPLETED" or row.get("exit") != "0":
                  raise SystemExit(f"{name} did not complete cleanly: {row}")

          required = (
              "results/amrfinderplus_nucleotide_baseline.tsv",
              "results/amrfinderplus_combined.tsv",
              "results/amrfinderplus_summary.md",
              "results/amrfinderplus_evidence.json",
              "results/experiment_report.json",
              "results/experiment_report.md",
              "results/tool_versions.txt",
              "results/amrfinderplus.log",
              "results/assembly_manifest.json",
              "results/dataset_cli_version.txt",
              "results/dataset_sha256.txt",
              "results/assembly_summary.jsonl",
              "nextflow-report.html",
          )
          for path in required:
              if not os.path.isfile(path) or os.path.getsize(path) == 0:
                  raise SystemExit(f"Required output missing or empty: {path}")

          for path in (
              "results/amrfinderplus_nucleotide_baseline.tsv",
              "results/amrfinderplus_combined.tsv",
          ):
              with open(path, newline="", encoding="utf-8") as handle:
                  reader = csv.reader(handle, delimiter="\t")
                  header = next(reader, [])
                  if "Element symbol" not in header or "Scope" not in header or "Method" not in header:
                      raise SystemExit(f"Unexpected AMRFinderPlus TSV header: {path}")

          with open("results/assembly_manifest.json", encoding="utf-8") as handle:
              manifest = json.load(handle)
          if manifest.get("biosample_accession") != os.environ["BIOSAMPLE"].upper():
              raise SystemExit("Assembly manifest BioSample does not match requested BioSample")
          if not re.fullmatch(r"GCA_[0-9]+\.[0-9]+|GCF_[0-9]+\.[0-9]+", manifest.get("assembly_accession", "")):
              raise SystemExit("Assembly manifest contains an invalid NCBI assembly accession")
          versions = open("results/tool_versions.txt", encoding="utf-8").read()
          if "AMRFinderPlus executable:" not in versions or "Database version:" not in versions:
              raise SystemExit("AMRFinderPlus software/database versions are missing")
          summary = open("results/amrfinderplus_summary.md", encoding="utf-8").read()
          if "Interpretation limits" not in summary or "Core and Plus scopes" not in summary:
              raise SystemExit("Scientific interpretation caveats are missing from summary")
          with open("results/amrfinderplus_evidence.json", encoding="utf-8") as handle:
              evidence = json.load(handle)
          detections = evidence.get("detections", [])
          if evidence.get("row_count") != len(detections):
              raise SystemExit("Normalized evidence row count does not match detections")
          if any(not item.get("scope") or not item.get("element_type") for item in detections):
              raise SystemExit("Normalized evidence is missing scope or element type")
          if evidence.get("review_flag_rows") != sum(bool(item.get("review_required")) for item in detections):
              raise SystemExit("Normalized evidence review-flag count is inconsistent")
          if "do not establish phenotypic resistance" not in evidence.get("interpretation", ""):
              raise SystemExit("Normalized evidence interpretation warning is missing")
          with open("results/experiment_report.json", encoding="utf-8") as handle:
              report = json.load(handle)
          if report.get("report_type") != "research_evidence_summary":
              raise SystemExit("Unified report has an unexpected report_type")
          report_detections = report.get("genomic_detections", [])
          if len(report_detections) != len(detections):
              raise SystemExit("Unified report detection count differs from normalized evidence")
          expected_amr_hits = sorted({
              item.get("gene_symbol") for item in detections
              if item.get("element_type", "").strip().upper() == "AMR" and item.get("gene_symbol")
          })
          if report.get("amr_hits") != expected_amr_hits:
              raise SystemExit("Unified report AMR hit symbols do not match the unique explicitly AMR-typed evidence symbols")
          if any(
              item.get("element_type", "").strip().upper() in {"VIRULENCE", "STRESS"}
              and item.get("gene_symbol") in report.get("amr_hits", [])
              for item in detections
          ):
              raise SystemExit("VIRULENCE/STRESS detection leaked into the AMR hit list")
          if "do not confirm phenotypic resistance" not in report.get("interpretation", ""):
              raise SystemExit("Unified report interpretation warning is missing")
          report_markdown = open("results/experiment_report.md", encoding="utf-8").read()
          if "not a clinical or diagnostic interpretation" not in report_markdown:
              raise SystemExit("Unified report Markdown caveat is missing")
          if "No AST phenotype observations were supplied" not in report_markdown:
              raise SystemExit("Unified report does not state the absence of isolate-level AST observations")
          print(f"Verified nucleotide baseline, combined AMRFinderPlus outputs, and unified reports for {manifest['assembly_accession']}")
          print("All three Nextflow processes completed with exit code 0; evidence counts, AMR-only filtering, report artifacts, provenance and interpretation caveats are present.")
          PY
          validation_rc=$?

          if [ "$validation_rc" -ne 0 ]; then
            echo "::error::Isolate output validation failed."
            echo "::group::.nextflow.log (tail)"
            tail -n 160 .nextflow.log || true
            echo "::endgroup::"
            exit 1
          fi

          if [ "$nextflow_rc" -ne 0 ]; then
            echo "::warning::Nextflow launcher returned $nextflow_rc, but the trace confirms every required process completed with exit code 0 and the real report passed output validation."
          fi
          exit 0

      - name: Upload experiment results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: biosignal-${{ inputs.biosample }}-experiment
          if-no-files-found: warn
          include-hidden-files: true
          path: |
            results/**
            nextflow-report.html
            nextflow-trace.txt
            **/amrfinderplus.tsv
            **/tool_versions.txt
            **/assembly_manifest.json
            **/amrfinderplus.log
            .nextflow.log
            work/**/.command.sh
            work/**/.command.err
            work/**/.command.log
            work/**/.command.out
