name: Public BioSignal integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: pip install -e .
      - name: Run public NCBI integration
        env:
          BIOSIGNAL_LIVE_NCBI: "1"
        run: pytest -m integration -q
