name: Public BioSignal integration

on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read

concurrency:
  group: biosignal-public-integration
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test suite
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pytest>=8.0"
          pytest -q

      - name: Resolve known public BioSample
        run: |
          python -m biosignal.resolve_assembly             SAMN05215988             --output /tmp/assembly_manifest.json
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("/tmp/assembly_manifest.json").read_text())
          assert manifest["biosample_accession"] == "SAMN05215988"
          assert manifest["assembly_accession"].startswith(("GCA_", "GCF_"))
          print(json.dumps(manifest, indent=2))
          PY
