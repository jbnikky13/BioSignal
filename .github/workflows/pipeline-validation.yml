name: BioSignal pipeline validation

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "workflows/**"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "workflows/**"
      - "pyproject.toml"
      - "pytest.ini"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: biosignal-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install package and test
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install "pytest>=8.0"
          pytest -q

      - name: Install Nextflow
        env:
          NXF_VER: "26.04.6"
        run: |
          curl -s https://get.nextflow.io | bash
          sudo mv nextflow /usr/local/bin/nextflow
          nextflow -version

      - name: Validate packaged resolver
        run: |
          python -m biosignal.resolve_assembly --help

      - name: Compile and stub public isolate workflow
        run: |
          nextflow run workflows/public_isolate.nf             --biosample "SAMN05215988"             --amrfinder_organism "Escherichia"             -stub-run
